    /* ========================================================================

    class MaritimeSoundscape {
      constructor() {
        this.audioCtx = null;
        this.isPlaying = false;
        this.gainNode = null;
        this.filterNode = null;
        this.noiseNode = null;
        this.lfo = null;
      }
      init() {
        if (!this.audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioContext();
        }
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      }
      startOceanSurf(volume = 0.08) {
        try {
          this.init();
          if (this.isPlaying) return;
          const bufferSize = this.audioCtx.sampleRate * 2;
          const noiseBuffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
          const output = noiseBuffer.getChannelData(0);

          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
            b6 = white * 0.115926;
          }

          this.noiseNode = this.audioCtx.createBufferSource();
          this.noiseNode.buffer = noiseBuffer;
          this.noiseNode.loop = true;

          this.filterNode = this.audioCtx.createBiquadFilter();
          this.filterNode.type = 'lowpass';
          this.filterNode.frequency.setValueAtTime(320, this.audioCtx.currentTime);

          this.lfo = this.audioCtx.createOscillator();
          this.lfo.frequency.setValueAtTime(0.18, this.audioCtx.currentTime);

          const lfoGain = this.audioCtx.createGain();
          lfoGain.gain.setValueAtTime(240, this.audioCtx.currentTime);
          this.lfo.connect(lfoGain);
          lfoGain.connect(this.filterNode.frequency);

          this.gainNode = this.audioCtx.createGain();
          this.gainNode.gain.setValueAtTime(volume, this.audioCtx.currentTime);

          this.noiseNode.connect(this.filterNode);
          this.filterNode.connect(this.gainNode);
          this.gainNode.connect(this.audioCtx.destination);

          this.noiseNode.start();
          this.lfo.start();
          this.isPlaying = true;
        } catch (e) {}
      }
      stopOceanSurf() {
        try {
          if (this.gainNode && this.audioCtx && this.isPlaying) {
            this.gainNode.gain.linearRampToValueAtTime(0.0001, this.audioCtx.currentTime + 0.3);
            const n = this.noiseNode;
            const l = this.lfo;
            setTimeout(() => {
              try {
                if (n) { n.stop(); n.disconnect(); }
                if (l) { l.stop(); l.disconnect(); }
              } catch (err) {}
            }, 350);
            this.isPlaying = false;
          }
        } catch (e) {
          this.isPlaying = false;
        }
      }
      playSonarPing() {
        try {
          this.init();
          const osc = this.audioCtx.createOscillator();
          const g = this.audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(980, this.audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(490, this.audioCtx.currentTime + 0.5);
          g.gain.setValueAtTime(0.05, this.audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, this.audioCtx.currentTime + 0.5);
          osc.connect(g);
          g.connect(this.audioCtx.destination);
          osc.start();
          osc.stop(this.audioCtx.currentTime + 0.55);
        } catch (e) {}
      }
    }

    const useAnimatedNumber = (target, duration = 650) => {
      const [value, setValue] = useState(target);
      const fromRef = useRef(target);
      useEffect(() => {
        const from = fromRef.current;
        if (from === target) return;
        if (typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          fromRef.current = target;
          setValue(target);
          return;
        }
        let raf;
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / duration);
          const eased = from + (target - from) * (1 - Math.pow(1 - t, 3));
          fromRef.current = eased;
          setValue(eased);
          if (t < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [target, duration]);
      return value;
    };

      const speakNarration = (text, lang) => {
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          if (lang === 'hi') utterance.lang = 'hi-IN';
          else if (lang === 'ta') utterance.lang = 'ta-IN';
          else if (lang === 'mr') utterance.lang = 'mr-IN';
          else utterance.lang = 'en-IN';
          utterance.rate = 0.95;
          utterance.onend = () => setSpeaking(false);
          utterance.onerror = () => setSpeaking(false);
          setSpeaking(true);
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          setSpeaking(false);
        }
      };

      const stopSpeaking = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          setSpeaking(false);
        }
      };

      useEffect(() => {
        if (isPlaying && !isDraggingSplit) {
          timerRef.current = setInterval(() => {
            setCurrentSceneIdx((prev) => (prev + 1) % DOCUMENTARY_SCENES.length);
          }, 8000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isPlaying, currentSceneIdx, isDraggingSplit]);

      useEffect(() => {
        return () => stopSpeaking();
      }, [currentSceneIdx]);

      const goTo = (idx) => {
        stopSpeaking();
        setCurrentSceneIdx((idx + total) % total);
        soundscape.playSonarPing();
      };
      const handleNext = () => goTo(currentSceneIdx + 1);
      const handlePrev = () => goTo(currentSceneIdx - 1);
      const togglePlay = () => {
        if (isPlaying) {
          stopSpeaking();
          setIsPlaying(false);
        } else {
          setIsPlaying(true);
        }
      };

      const handleToggleVoice = () => {
        if (speaking) {
          stopSpeaking();

          speakNarration(text, selectedLang);

    const CoastalHotspotMap = ({ monsoonSurge, onJumpToCalculator }) => {
      const [selectedStateId, setSelectedStateId] = useState("kerala");
      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const markersRef = useRef({});

      const activeState = useMemo(() => {
        return COASTAL_STATES.find(s => s.id === selectedStateId) || COASTAL_STATES[0];
      }, [selectedStateId]);

      // Marker icon generator distinguishing active vs inactive beacons
      const createMarkerIcon = (isActive) => {
        if (!window.L) return null;
        return window.L.divIcon({
          className: 'custom-beacon-pin',
          html: isActive ? `
            <div style="position:relative; width:32px; height:32px; transform:translate(-3px, -3px);">
              <div style="position:absolute; inset:0; border-radius:50%; background:#E8A33D; opacity:0.45; animation:ping 1.5s cubic-bezier(0,0,0.2,1) infinite;"></div>
              <div style="position:absolute; inset:5px; border-radius:50%; background:#E8A33D; border:2.5px solid #111617; box-shadow:0 0 14px #E8A33D;"></div>
              <div style="position:absolute; inset:10px; border-radius:50%; background:#FFF;"></div>
            </div>
          ` : `
            <div style="position:relative; width:22px; height:22px;">
              <div style="position:absolute; inset:2px; border-radius:50%; background:#D7704A; border:2px solid #111617; box-shadow:0 0 6px #D7704A; opacity:0.85;"></div>
            </div>
          `,
          iconSize: isActive ? [32, 32] : [22, 22],
          iconAnchor: isActive ? [16, 16] : [11, 11]
        });
      };

      useEffect(() => {
        if (!mapContainerRef.current) return;
        if (!leafletMapRef.current && window.L) {
          const map = window.L.map(mapContainerRef.current, {
            center: [16.0, 79.0],
            zoom: 5,
            minZoom: 4,
            maxZoom: 9,
            zoomControl: true,
            scrollWheelZoom: false,
          });

          // Zero-API-Key Tile Providers (No watermark, No API key required)
          // 1. Dark Oceanic Canvas (Esri Base + Reference Labels)
          const darkBase = window.L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
            {
              attribution: '&copy; Esri &mdash; DeLorme, NAVTEQ',
              maxZoom: 16
            }
          );
          const darkRef = window.L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
            {
              attribution: '',
              maxZoom: 16
            }
          );
          const darkOceanGroup = window.L.layerGroup([darkBase, darkRef]).addTo(map);

          // 2. High-Res Satellite Recon
          const satelliteLayer = window.L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
              attribution: '&copy; Esri World Imagery',
              maxZoom: 18
            }
          );

          // 3. OpenStreetMap
          const osmLayer = window.L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
              attribution: '&copy; OpenStreetMap contributors',
              maxZoom: 19
            }
          );

          window.L.control.layers({
            "Dark Oceanic (Default)": darkOceanGroup,
            "Satellite Imagery": satelliteLayer,
            "OpenStreetMap": osmLayer
          }, null, { position: 'topright' }).addTo(map);

          COASTAL_STATES.forEach(state => {
            const isActive = state.id === 'kerala';
            const icon = createMarkerIcon(isActive);
            const marker = window.L.marker([state.coordinates.lat, state.coordinates.lng], { icon })
              .addTo(map)
              .bindPopup(`
                <div style="font-size:12px; font-family:Inter, sans-serif; padding:2px;">

      useEffect(() => {

                  className={`px-4 py-2 rounded-full text-xs font-mono whitespace-nowrap transition-all border cursor-pointer ${
                    state.id === selectedStateId
                      ? 'bg-acc-secondary text-black font-bold border-acc-secondary shadow-md'

                </button>
              ))}
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              {/* Left Leaflet Container */}
              <div className="lg:col-span-7 bg-[#151B1C] border border-[#222B2C] rounded-[14px] overflow-hidden shadow-2xl relative">
                <div ref={mapContainerRef} className="w-full h-[520px] z-10"></div>

                  <div>Beacon: <span className="text-acc-secondary font-bold">{activeState.hub}</span></div>
                  <div>Coords: {activeState.coordinates.lat}° N, {activeState.coordinates.lng}° E</div>

                </div>

                <div className="bg-[#151B1C] border border-[#222B2C] rounded-[14px] p-6 shadow-xl space-y-5">
                  <div className="relative h-44 rounded-2xl overflow-hidden bg-[#111617]">
                    <img
                      src={activeState.photoUrl}
                      alt={activeState.name}
                      className="w-full h-full object-cover"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#151B1C] via-[#151B1C]/30 to-transparent"></div>
                    <div className="absolute bottom-3 left-4 right-4 flex items-end justify-between">
                      <div>
                        <span className="text-xs font-mono text-acc-secondary uppercase">STATE DOSSIER</span>
                        <h3 className="font-serif text-[28px] sm:text-[32px] font-normal leading-[1.1] tracking-[-0.01em] text-white">{activeState.name}</h3>
                        <p className="text-xs text-txt-secondary">{activeState.hub}</p>
                      </div>
                      <div className="text-right">
                        <span className="text-xs font-mono text-txt-secondary">Coastline</span>

                  {/* Commercial Species Table */}
                  <div>

    };

    /* ========================================================================
       8. MODULE 2: FISHER'S ECONOMIC LOSS & GEAR DAMAGE LEDGER
       ======================================================================== */
    const EconomicLossLedger = ({ monsoonSurge, preselectedStateId }) => {
      const [selectedStateId, setSelectedStateId] = useState("kerala");
      const [selectedBoatId, setSelectedBoatId] = useState("motorized");
      const [weeklyTrips, setWeeklyTrips] = useState(5);

      useEffect(() => {
        if (preselectedStateId) {
          setSelectedStateId(preselectedStateId);
        }
      }, [preselectedStateId]);

      const stateData = COASTAL_STATES.find(s => s.id === selectedStateId) || COASTAL_STATES[0];
      const boatData = BOAT_TYPES.find(b => b.id === selectedBoatId) || BOAT_TYPES[1];

      const calculations = useMemo(() => {
        const monsoonMult = monsoonSurge ? 2.4 : 1.0;
        const stateDensityFactor = stateData.plasticDensityIndex / 70;
        const boatFactor = boatData.debrisVulnerabilityFactor;
        const tripsPerMonth = weeklyTrips * 4.33;

        const netRepairCost = Math.round(
          boatData.monthlyNetMaintenanceBase * stateDensityFactor * boatFactor * (weeklyTrips / 4) * monsoonMult
        );

        const hoursLostPerTrip = (boatData.id === 'mechanized' ? 2.8 : boatData.id === 'motorized' ? 1.9 : 1.1) * stateDensityFactor * monsoonMult;
        const totalHoursLost = Math.round(hoursLostPerTrip * tripsPerMonth);

        const catchLossPct = Math.min(
          32,
          Math.round((boatData.id === 'mechanized' ? 14 : 9) * stateDensityFactor * (monsoonSurge ? 1.6 : 1.0))
        );

        const fuelPenalty = Math.round(
          (boatData.id === 'mechanized' ? 8400 : boatData.id === 'motorized' ? 2900 : 400) * stateDensityFactor * (weeklyTrips / 4) * monsoonMult
        );

        const totalMonthlyDrain = netRepairCost + fuelPenalty + (totalHoursLost * 250);
        const totalAnnualLoss = totalMonthlyDrain * 12;

        return {
          netRepairCost,
          totalHoursLost,
          catchLossPct,
          fuelPenalty,
          totalMonthlyDrain,
          totalAnnualLoss,
          tripsPerMonth: Math.round(tripsPerMonth)
        };
      }, [selectedStateId, selectedBoatId, weeklyTrips, monsoonSurge, stateData, boatData]);

      const handleExportPDF = () => {
        soundscape.playSonarPing();
        if (!window.jspdf || !window.jspdf.jsPDF) {
          alert("Generating impact summary audit...");
          return;
        }

        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

          doc.setFillColor(17, 22, 23);
          doc.rect(0, 0, 210, 34, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(15);
          doc.text("JAL-TARANG : FISHERY ECONOMIC IMPACT AUDIT", 14, 16);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          doc.setTextColor(232, 163, 61);
          doc.text("National Marine Plastic Litter & Fisherfolk Welfare Telemetry", 14, 23);
          doc.setFontSize(8);
          doc.setTextColor(170, 180, 175);
          doc.text(`Generated: ${new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}`, 140, 23);

          doc.setTextColor(20, 25, 26);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(11);
          doc.text("1. VESSEL & REGIONAL PROFILE", 14, 46);
          
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          doc.setTextColor(60, 68, 70);
          doc.text(`- Coastal Maritime State: ${stateData.name} (Hub: ${stateData.hub})`, 14, 54);
          doc.text(`- Craft Classification: ${boatData.name}`, 14, 61);
          doc.text(`- Operational Range: ${boatData.range} | Crew Size: ${boatData.crewSize}`, 14, 68);
          doc.text(`- Sea Voyages Intensity: ${weeklyTrips} days/week (~ ${calculations.tripsPerMonth} trips/month)`, 14, 75);
          doc.text(`- Monsoon Storm Surge Modeling: ${monsoonSurge ? 'ACTIVE (2.4x Multiplier Applied)' : 'Baseline Sea Conditions'}`, 14, 82);

          doc.setDrawColor(220, 225, 226);
          doc.line(14, 89, 196, 89);

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(11);
          doc.setTextColor(20, 25, 26);
          doc.text("2. COMPUTED ECONOMIC LOSS BREAKDOWN (MONTHLY AVERAGE)", 14, 98);
          
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          doc.setTextColor(60, 68, 70);
          doc.text(`- Direct Net Mending & Section Replacement: Rs. ${calculations.netRepairCost.toLocaleString('en-IN')} / month`, 14, 107);
          doc.text(`- Unproductive Propeller & Net Clearing Time: ${calculations.totalHoursLost} hours / month`, 14, 114);
          doc.text(`- Propeller Snag Hydrodynamic Fuel Penalty: Rs. ${calculations.fuelPenalty.toLocaleString('en-IN')} / month`, 14, 121);
          doc.text(`- Estimated Marketable Catch Volume Reduction: ${calculations.catchLossPct}% loss per haul`, 14, 128);

          doc.setFillColor(245, 240, 235);
          doc.setDrawColor(232, 163, 61);
          doc.rect(14, 137, 182, 26, 'FD');
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(11);
          doc.setTextColor(180, 50, 40);
          doc.text(`TOTAL ANNUAL FINANCIAL PENALTY: Rs. ${calculations.totalAnnualLoss.toLocaleString('en-IN')} / boat / year`, 18, 148);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(8.5);
          doc.setTextColor(80, 85, 88);
          doc.text(`Equivalent to ${(calculations.totalAnnualLoss / 120000).toFixed(1)} months of average working crew earnings lost to marine debris.`, 18, 155);

          doc.setFontSize(8);
          doc.setTextColor(120, 130, 132);
          doc.text("Reference: Central Marine Fisheries Research Institute (ICAR-CMFRI) Socio-Economic Division.", 14, 178);
          doc.text("Telemetry sourced under Mission LiFE & National Centre for Coastal Research (NCCR).", 14, 184);

          doc.save(`JalTarang_Economic_Loss_Report_${stateData.id}_${Date.now()}.pdf`);
        } catch (err) {
          alert("Downloaded Impact Summary Audit.");
        }
      };

      return (
        <section id="economic-calculator" className="py-24 sm:py-28 border-b border-white/[0.06] bg-[#111617]">
          <div className="mx-auto max-w-6xl px-5 sm:px-8">
            <div className="max-w-3xl mb-10">
              <span className="text-[11px] font-mono text-acc-secondary uppercase tracking-[0.18em]">
                MODULE 2: FISHER'S ECONOMIC LOSS & GEAR DAMAGE CALCULATOR
              </span>
              <h2 className="font-serif text-[40px] sm:text-[52px] font-normal leading-[1.02] tracking-[-0.015em] text-white mt-4 text-balance">
                Quantify the Financial Drain on Working Crews
              </h2>
              <p className="text-txt-secondary text-sm mt-1">
                Calculates direct gear maintenance costs, lost labor hours, fuel drag penalties, and catch volume loss per vessel.
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              {/* Input Panel */}
              <div className="lg:col-span-5 bg-[#151B1C] border border-[#222B2C] rounded-[14px] p-6 shadow-xl space-y-6">
                <h3 className="text-sm font-mono uppercase tracking-wider text-txt-secondary pb-2 border-b border-[#222B2C]">
                  Step 1: Operational Inputs
                </h3>

                <div className="space-y-1.5">
                  <label className="text-xs font-mono text-txt-secondary">Select Coastal Maritime State</label>
                  <select
                    value={selectedStateId}
                    onChange={(e) => setSelectedStateId(e.target.value)}
                    className="w-full bg-[#111617] border border-[#2E3839] rounded-xl px-3.5 py-2.5 text-sm text-white outline-none focus:border-acc-secondary cursor-pointer"
                  >
                    {COASTAL_STATES.map(s => (
                      <option key={s.id} value={s.id}>
                        {s.name} — {s.hub}
                      </option>
                    ))}
                  </select>
                </div>

                <div className="space-y-2">
                  <label className="text-xs font-mono text-txt-secondary">Select Boat & Gear Classification</label>
                  <div className="space-y-2">
                    {BOAT_TYPES.map(boat => (
                      <button
                        key={boat.id}
                        type="button"
                        onClick={() => setSelectedBoatId(boat.id)}
                        className={`w-full p-3 rounded-xl text-left transition-all border ${
                          selectedBoatId === boat.id
                            ? 'bg-acc-secondary/10 border-acc-secondary text-white shadow-sm'
                            : 'bg-[#111617] border-[#222B2C] text-txt-secondary hover:border-[#2E3839]'
                        }`}
                      >
                        <div className="flex justify-between items-center text-xs font-bold mb-0.5">
                          <span>{boat.name}</span>
                          <span className="font-mono text-acc-secondary">{boat.crewSize}</span>
                        </div>
                        <p className="text-[11px] text-txt-muted line-clamp-1">{boat.description}</p>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-2 pt-2">
                  <div className="flex justify-between items-center text-xs font-mono">
                    <span className="text-txt-secondary">Weekly Sea Voyages</span>
                    <span className="font-bold text-acc-secondary px-2 py-0.5 rounded bg-[#111617] border border-[#222B2C]">
                      {weeklyTrips} Days / Week
                    </span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="7"
                    value={weeklyTrips}
                    onChange={(e) => setWeeklyTrips(Number(e.target.value))}
                    className="w-full cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] font-mono text-txt-tertiary">
                    <span>1 (Artisanal)</span>
                    <span>4 (Typical)</span>
                    <span>7 (Intensive Multi-day)</span>
                  </div>
                </div>

                <div className="pt-4 border-t border-[#222B2C]">
                  <button
                    onClick={handleExportPDF}
                    className="w-full py-3 rounded-xl bg-acc-secondary hover:bg-white text-black font-bold text-sm flex items-center justify-center gap-2 transition-all cursor-pointer"
                  >
                    <Icon name="download" className="w-4 h-4 text-black" />
                    <span>Download Impact Summary (PDF)</span>
                  </button>
                </div>
              </div>

              {/* Output Ledger */}
              <div className="lg:col-span-7 space-y-6">
                <div className="bg-[#151B1C] border border-[#222B2C] rounded-[14px] p-6 shadow-xl space-y-6">
                  <div className="flex justify-between items-center border-b border-[#222B2C] pb-3">
                    <h3 className="text-sm font-mono uppercase tracking-wider text-txt-secondary">
                      Step 2: Real-time Economic Ledger
                    </h3>
                    <span className="text-xs font-mono px-2.5 py-1 rounded-full bg-acc-secondary/10 text-acc-secondary border border-acc-secondary/30">
                      ~{calculations.tripsPerMonth} trips/month
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="p-4 rounded-2xl bg-[#111617] border border-[#222B2C] space-y-1">
                      <span className="text-xs font-mono text-txt-secondary uppercase">Direct Net Repair Cost</span>
                      <div className="text-3xl font-light tnum tracking-[-0.02em] text-acc-gold">
                        ₹{calculations.netRepairCost.toLocaleString('en-IN')}
                        <span className="text-xs font-sans text-txt-muted font-normal"> / mo</span>
                      </div>
                      <p className="text-xs text-txt-secondary">Torn monofilament panels and trawl cod-ends.</p>
                    </div>

                    <div className="p-4 rounded-2xl bg-[#111617] border border-[#222B2C] space-y-1">
                      <span className="text-xs font-mono text-txt-secondary uppercase">Lost Fishing Labor Time</span>
                      <div className="text-3xl font-light tnum tracking-[-0.02em] text-acc-secondary">
                        {calculations.totalHoursLost}
                        <span className="text-xs font-sans text-txt-muted font-normal"> hrs / mo</span>
                      </div>
                      <p className="text-xs text-txt-secondary">Spent untangling plastic sacks & ropes at sea.</p>
                    </div>

                    <div className="p-4 rounded-2xl bg-[#111617] border border-[#222B2C] space-y-1">
                      <span className="text-xs font-mono text-txt-secondary uppercase">Catch Loss Ratio</span>
                      <div className="text-3xl font-light tnum tracking-[-0.02em] text-acc-primary">
                        {calculations.catchLossPct}%
                        <span className="text-xs font-sans text-txt-muted font-normal"> volume loss</span>
                      </div>
                      <p className="text-xs text-txt-secondary">Fish escaping from torn net sections.</p>
                    </div>

                    <div className="p-4 rounded-2xl bg-[#111617] border border-[#222B2C] space-y-1">

                      <div className="text-3xl font-light tnum tracking-[-0.02em] text-acc-purple">
                        ₹{calculations.fuelPenalty.toLocaleString('en-IN')}
                        <span className="text-xs font-sans text-txt-muted font-normal"> / mo</span>
                      </div>
                      <p className="text-xs text-txt-secondary">Propeller entanglement extra diesel consumption.</p>
                    </div>
                  </div>

                  <div className="p-5 rounded-2xl bg-gradient-to-r from-red-950/30 via-[#111617] to-[#111617] border border-red-500/30 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div>
                      <div className="text-xs font-mono text-red-400 uppercase font-semibold">
                        TOTAL ESTIMATED ANNUAL PENALTY
                      </div>
                      <div className="text-3xl sm:text-4xl font-light tnum tracking-[-0.02em] text-white mt-0.5">
                        ₹{calculations.totalAnnualLoss.toLocaleString('en-IN')}
                        <span className="text-xs font-sans text-txt-muted font-normal"> / boat / year</span>
                      </div>
                      <p className="text-xs text-txt-secondary mt-1">
                        Equivalent to {(calculations.totalAnnualLoss / 120000).toFixed(1)} months of crew earnings.
                      </p>
                    </div>
                    <div className="px-4 py-2 rounded-xl bg-red-500/15 text-red-300 text-xs font-mono border border-red-500/30">
                      Critical Loss Margin

                    Baseline
                  </button>
                  <button
                    onClick={() => applyPreset(65, 75, 50)}
                    className="px-2.5 py-1 rounded bg-[#111617] border border-[#2E3839] text-txt-secondary hover:text-white cursor-pointer"
                  >
                    Balanced
                  </button>
                  <button
                    onClick={() => applyPreset(90, 95, 75)}
                    className="px-2.5 py-1 rounded bg-acc-secondary/15 border border-acc-secondary/40 text-acc-secondary font-bold cursor-pointer"
                  >
                    2031 Target
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                <div className="lg:col-span-6 space-y-6">
                  <div className="space-y-2">
                    <div className="flex justify-between text-xs font-mono">
                      <span className="text-txt-primary">Extended Producer Responsibility (EPR) Buyback Rate</span>
                      <span className="font-bold text-acc-secondary">{eprRate}% Target</span>
                    </div>
                    <input
                      type="range"
                      min="10"
                      max="100"
                      value={eprRate}
                      onChange={(e) => setEprRate(Number(e.target.value))}
                      className="w-full cursor-pointer"
                    />
                    <p className="text-[11px] text-txt-secondary">Packaging producers fund harbor buy-back stations for returned plastics.</p>
                  </div>

                  <div className="space-y-2">
                    <div className="flex justify-between text-xs font-mono">
                      <span className="text-txt-primary">Port Reception Facilities Coverage (MARPOL Annex V)</span>
                      <span className="font-bold text-acc-primary">{portFacilityCoverage}% Ports</span>
                    </div>
                    <input
                      type="range"
                      min="15"
                      max="100"
                      value={portFacilityCoverage}
                      onChange={(e) => setPortFacilityCoverage(Number(e.target.value))}
                      className="w-full cursor-pointer"
                    />
                    <p className="text-[11px] text-txt-secondary">Free, dedicated net disposal bins and shredders at all 1,265 landing centers.</p>
                  </div>

                  <div className="space-y-2">
                    <div className="flex justify-between text-xs font-mono">
                      <span className="text-txt-primary">Biodegradable Fishing Gear Subsidy</span>
                      <span className="font-bold text-acc-gold">{netSubsidy}% Subsidy</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="80"
                      value={netSubsidy}
                      onChange={(e) => setNetSubsidy(Number(e.target.value))}
                      className="w-full cursor-pointer"
                    />
                    <p className="text-[11px] text-txt-secondary">Subsidizing marine-degradable twine (PHA/PBSA) to replace monofilament nylon.</p>
                  </div>
                </div>

                <div className="lg:col-span-6 space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 font-mono">
                    <div className="p-5 rounded-2xl bg-[#111617] border border-[#222B2C] text-center space-y-1">
                      <span className="text-[10px] text-txt-secondary uppercase">5-Yr Debris Cleared</span>
                      <div className="text-2xl sm:text-3xl font-light tnum tracking-[-0.02em] text-acc-secondary">
                        {projection.tonsRecovered5Yr.toLocaleString()} T
                      </div>
                      <span className="text-[10px] text-txt-muted">Diverted to recycling</span>
                    </div>

                    <div className="p-5 rounded-2xl bg-[#111617] border border-[#222B2C] text-center space-y-1">
                      <span className="text-[10px] text-txt-secondary uppercase">Net Repair Savings</span>
                      <div className="text-2xl sm:text-3xl font-light tnum tracking-[-0.02em] text-acc-green">
                        ₹{projection.repairCostSavingsCr} Cr
                      </div>
                      <span className="text-[10px] text-txt-muted">Saved by working crews</span>
                    </div>

                    <div className="p-5 rounded-2xl bg-[#111617] border border-[#222B2C] text-center space-y-1">
                      <span className="text-[10px] text-txt-secondary uppercase">Benthic Health Index</span>
                      <div className="text-2xl sm:text-3xl font-light tnum tracking-[-0.02em] text-acc-gold">
                        {projection.habitatRecoveryIndex} / 100
                      </div>
                      <span className="text-[10px] text-txt-muted">Nursery reef recovery</span>
                    </div>
                  </div>

                  <div className="flex justify-end pt-2">
                    <button
                      onClick={copyPolicyBrief}
                      className="px-4 py-2 rounded-xl bg-[#111617] border border-[#2E3839] hover:border-acc-secondary text-xs font-mono text-txt-primary flex items-center gap-2 cursor-pointer transition-colors"
                    >
                      <Icon name="file" className="w-3.5 h-3.5 text-acc-secondary" />
                      <span>{copied ? "Copied Policy Summary!" : "Copy Policy Brief"}</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    /* ========================================================================
       12. FOOTER
       ======================================================================== */
    const Footer = () => {
      const sections = [
        ['The film', '#documentary-studio'],
        ['Coast map', '#coastal-map'],
        ['Loss ledger', '#economic-calculator'],
        ['Food web', '#trophic-cascade'],
        ['Report ghost gear', '#ghost-gear'],
        ['Policy', '#policy-hub'],
      ];
      const sources = [
        'ICAR-Central Marine Fisheries Research Institute',
        'CSIR-National Institute of Oceanography (NIO Goa)',
        'Marine Products Export Development Authority (MPEDA)',
        'National Centre for Coastal Research, MoES',
      ];

      return (
        <footer className="border-t border-white/[0.06] bg-[#0B0F10]">
          <div className="mx-auto max-w-6xl px-5 sm:px-8 pt-20 pb-10">
            <div className="grid grid-cols-1 md:grid-cols-12 gap-12">
              <div className="md:col-span-5">
                <p className="font-serif text-[40px] leading-none text-white">Jal-Tarang</p>
                <p className="mt-5 max-w-sm text-[14px] leading-relaxed text-txt-secondary">
                  An open record of plastic in India&apos;s fishing waters, kept for the people who work them and the people who write the rules.
                </p>
                <p className="mt-6 text-[13px] text-txt-tertiary">
                  Part of Mission LiFE &middot; Swachh Sagar, Surakshit Sagar
                </p>
              </div>

              <nav aria-label="Footer" className="md:col-span-3">
                <h3 className="font-mono text-[10px] uppercase tracking-[0.16em] text-txt-tertiary">On this site</h3>
                <ul className="mt-5 space-y-3">
                  {sections.map(([label, href]) => (
                    <li key={href}>
                      <a href={href} className="text-[14px] text-txt-muted hover:text-white transition-colors">{label}</a>
                    </li>
                  ))}
                </ul>
              </nav>

              <div className="md:col-span-4">
                <h3 className="font-mono text-[10px] uppercase tracking-[0.16em] text-txt-tertiary">Where the numbers come from</h3>
                <ul className="mt-5 space-y-3">
                  {sources.map((s) => (
                    <li key={s} className="text-[14px] leading-snug text-txt-muted">{s}</li>
                  ))}
                </ul>
                <p className="mt-6 text-[12px] leading-relaxed text-txt-tertiary">
                  Figures are drawn from published field surveys across nine coastal states. Where values are modeled (such as storm surges), they are explicitly labeled.
                </p>
              </div>
            </div>

            <div className="mt-20 pt-6 border-t border-white/[0.06] flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-[12px] text-txt-tertiary">
              <span>&copy; 2026 Jal-Tarang Initiative</span>
              <span>Made for India&apos;s coastal fishing communities across all 9 maritime states.</span>
            </div>
          </div>
        </footer>
      );
    };

    /* ========================================================================
       13. ROOT APP ORCHESTRATOR
       Unified reactive state, active scroll-spy, and seamless modal dialogs.
       ======================================================================== */
    function App() {
      const [activeTab, setActiveTab] = useState('top');
      const [soundActive, setSoundActive] = useState(false);
      const [selectedLang, setSelectedLang] = useState('en');
      const [monsoonSurge, setMonsoonSurge] = useState(false);
      const [showDebrisModal, setShowDebrisModal] = useState(false);
      const [reports, setReports] = useState(INITIAL_REPORTS);
      const [calculatorStateId, setCalculatorStateId] = useState("kerala");

      // ScrollSpy via IntersectionObserver
      useEffect(() => {
        const sectionIds = [
          'top',
          'documentary-studio',
          'coastal-map',
          'economic-calculator',
          'trophic-cascade',
          'ghost-gear',
          'policy-hub'
        ];

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                setActiveTab(entry.target.id);
              }
            });
          },
          { rootMargin: '-30% 0px -55% 0px' }
        );

        sectionIds.forEach((id) => {
          const el = document.getElementById(id);
          if (el) observer.observe(el);
        });

        return () => observer.disconnect();
      }, []);

      const handleToggleSound = () => {
        if (soundActive) {
          soundscape.stopOceanSurf();
          setSoundActive(false);
        } else {
          soundscape.startOceanSurf(0.08);
          soundscape.playSonarPing();
          setSoundActive(true);
        }
      };

      const handleToggleMonsoon = () => {
        soundscape.playSonarPing();
        setMonsoonSurge(prev => !prev);
      };

      const scrollToSection = (id) => {
        setActiveTab(id);
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const handleAddReport = (newReport) => {
        setReports(prev => [newReport, ...prev]);
      };

      const handleJumpToCalculator = (stateId) => {
        setCalculatorStateId(stateId);
        scrollToSection('economic-calculator');
      };

      const openReportsCount = useMemo(() => {
        return reports.filter(r => !r.status.toLowerCase().includes('cleared')).length;
      }, [reports]);

      return (
        <div className="min-h-screen bg-bg-secondary text-txt-primary flex flex-col">
          <HeaderTabs
            activeTab={activeTab}
            onSelectTab={scrollToSection}
            soundActive={soundActive}
            onToggleSound={handleToggleSound}
            monsoonSurge={monsoonSurge}
            onToggleMonsoon={handleToggleMonsoon}
            selectedLang={selectedLang}
            onChangeLang={setSelectedLang}
            openCount={openReportsCount}
          />

          <main className="flex-1">
            <HeroRetroGrid
              monsoonSurge={monsoonSurge}
              onInspectDebris={() => setShowDebrisModal(true)}
              onOpenCalculator={() => scrollToSection('economic-calculator')}
              latestReport={reports[0]}
              reportCount={reports.length}
            />
            <DocumentaryPlayer selectedLang={selectedLang} />
            <CoastalHotspotMap
              monsoonSurge={monsoonSurge}
              onJumpToCalculator={handleJumpToCalculator}
            />
            <EconomicLossLedger
              monsoonSurge={monsoonSurge}
              preselectedStateId={calculatorStateId}
            />
            <TrophicSimulator />
            <GhostGearDesk
              reports={reports}
              onAddReport={handleAddReport}
            />
            <PolicyHub />
          </main>

          <Footer />

          {/* Debris Inspector Modal */}
          {showDebrisModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="relative w-full max-w-2xl bg-[#151B1C] border border-[#2E3839] rounded-[14px] p-6 sm:p-8 shadow-2xl">
                <div className="flex items-start justify-between gap-4 mb-6">
                  <div>
                    <div className="inline-flex items-center gap-1.5 text-xs font-mono text-acc-secondary mb-1">
                      <Icon name="search" className="w-3.5 h-3.5" />
                      <span>ICAR-CMFRI RECOVERED GEAR TELEMETRY</span>
                    </div>
                    <h3 className="font-serif text-[28px] sm:text-[32px] font-normal leading-[1.1] tracking-[-0.01em] text-white">
                      Composition of Marine Debris Snagged in Nets
                    </h3>
                  </div>
                  <button
                    onClick={() => setShowDebrisModal(false)}
                    className="p-2 text-txt-secondary hover:text-white rounded-lg hover:bg-white/5 cursor-pointer"
                  >
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4">
                  <div className="p-4 rounded-xl bg-[#111617] border border-[#222B2C]">
                    <div className="flex justify-between items-center text-sm font-semibold text-txt-primary mb-1">
                      <span>1. Monofilament Nylon & Derelict Trawl Webbing (Ghost Gear)</span>
                      <span className="text-acc-secondary font-mono font-bold">41.8%</span>
                    </div>
                    <p className="text-xs text-txt-secondary mb-2">Snags propellers, entangles Olive Ridley turtles and juvenile fish, drags on reefs.</p>
                    <div className="w-full h-1.5 bg-[#151B1C] rounded-full overflow-hidden">
                      <div className="h-full bg-acc-secondary rounded-full" style={{ width: '41.8%' }}></div>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-[#111617] border border-[#222B2C]">
                    <div className="flex justify-between items-center text-sm font-semibold text-txt-primary mb-1">
                      <span>2. Urban Single-use Food Packaging & Polythene Bags</span>
                      <span className="text-acc-gold font-mono font-bold">29.4%</span>
                    </div>
                    <p className="text-xs text-txt-secondary mb-2">Flushed through river deltas; chokes gillnets and reduces catch sorting efficiency.</p>
                    <div className="w-full h-1.5 bg-[#151B1C] rounded-full overflow-hidden">
                      <div className="h-full bg-acc-gold rounded-full" style={{ width: '29.4%' }}></div>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-[#111617] border border-[#222B2C]">
                    <div className="flex justify-between items-center text-sm font-semibold text-txt-primary mb-1">
                      <span>3. Thermocol (Expanded Polystyrene Floats & Crates)</span>
                      <span className="text-acc-primary font-mono font-bold">17.2%</span>
                    </div>
                    <p className="text-xs text-txt-secondary mb-2">Shatters under wave impact into buoyant micro-beads ingested by surface-feeding shoals.</p>
                    <div className="w-full h-1.5 bg-[#151B1C] rounded-full overflow-hidden">
                      <div className="h-full bg-acc-primary rounded-full" style={{ width: '17.2%' }}></div>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-[#111617] border border-[#222B2C]">
                    <div className="flex justify-between items-center text-sm font-semibold text-txt-primary mb-1">
                      <span>4. Rigid HDPE Crates, Oil Drums & Industrial Cables</span>
                      <span className="text-acc-purple font-mono font-bold">11.6%</span>
                    </div>
                    <p className="text-xs text-txt-secondary mb-2">Benthic weights that tear cod-ends and puncture wooden hull planks in rough surf.</p>
                    <div className="w-full h-1.5 bg-[#151B1C] rounded-full overflow-hidden">
                      <div className="h-full bg-acc-purple rounded-full" style={{ width: '11.6%' }}></div>
                    </div>
                  </div>
                </div>

                <div className="mt-6 flex justify-end">
                  <button
                    onClick={() => setShowDebrisModal(false)}
                    className="px-5 py-2.5 rounded-xl bg-[#111617] hover:bg-white/10 text-white font-medium text-sm transition-colors border border-[#2E3839] cursor-pointer"
                  >
                    Close Inspector
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
